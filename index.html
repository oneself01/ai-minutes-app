<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI議事録</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f6f7fb;
      color: #222;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    h1, h2 {
      margin: 0 0 12px;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d8dce7;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      background: #111827;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button.secondary {
      background: #eef2ff;
      color: #111827;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .status {
      white-space: pre-wrap;
      background: #f3f4f6;
      padding: 10px;
      border-radius: 10px;
      min-height: 40px;
    }
    .list {
      display: grid;
      gap: 8px;
    }
    label.chk {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
    }
    label.chk input {
      width: auto;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f9fafb;
      padding: 12px;
      border-radius: 10px;
    }
    .muted {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI議事録 MVP</h1>

    <div class="card">
      <h2>1. 参加者登録</h2>
      <input id="p_name" placeholder="名前">
      <div style="height:10px"></div>
      <div class="row">
        <button type="button" id="startSample">声サンプル録音開始</button>
        <button type="button" id="stopSample" class="secondary">停止して保存</button>
      </div>
      <div style="height:10px"></div>
      <button type="button" id="registerParticipant">参加者を登録</button>
    </div>

    <div class="card">
      <h2>2. 会議作成</h2>
      <input id="meeting_title" placeholder="会議名">
      <div style="height:10px"></div>
      <div id="participants" class="list"></div>
      <div style="height:10px"></div>
      <button type="button" id="createMeeting">会議を作成</button>
      <p class="muted" id="meetingInfo"></p>
    </div>

    <div class="card">
      <h2>3. 会議録音</h2>
      <div class="row">
        <button type="button" id="startMeetingRec">会議録音開始</button>
        <button type="button" id="stopMeetingRec" class="secondary">会議録音停止</button>
      </div>
      <div style="height:10px"></div>
      <button type="button" id="uploadMeeting">会議音声をアップロード</button>
      <div style="height:10px"></div>
      <button type="button" id="processMeeting">議事録を生成</button>
    </div>

    <div class="card">
      <h2>4. 状態</h2>
      <div id="status" class="status"></div>
    </div>

    <div class="card">
      <h2>5. 議事録結果</h2>
      <pre id="result"></pre>
    </div>
  </div>

  <script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbz4ctET6SWq0dKJ69vTehPnqdo-2IFojwtNefLrKlIECcuvPgCxGVTMoxgLWZm5OzTt/exec';

  let sampleRecorder = null;
  let sampleChunks = [];
  let sampleBlob = null;
  let sampleStream = null;

  let meetingRecorder = null;
  let meetingChunks = [];
  let meetingBlob = null;
  let meetingStream = null;

  let currentMeetingId = null;

  const els = {
    startSample: document.getElementById('startSample'),
    stopSample: document.getElementById('stopSample'),
    registerParticipant: document.getElementById('registerParticipant'),
    createMeeting: document.getElementById('createMeeting'),
    startMeetingRec: document.getElementById('startMeetingRec'),
    stopMeetingRec: document.getElementById('stopMeetingRec'),
    uploadMeeting: document.getElementById('uploadMeeting'),
    processMeeting: document.getElementById('processMeeting'),
    status: document.getElementById('status'),
    result: document.getElementById('result'),
    pName: document.getElementById('p_name'),
    meetingTitle: document.getElementById('meeting_title'),
    meetingInfo: document.getElementById('meetingInfo'),
    participants: document.getElementById('participants')
  };

  document.addEventListener('DOMContentLoaded', async () => {
    setInitialButtons();
    await refreshParticipants();
    setStatus('準備完了');
  });

  function setInitialButtons() {
    els.startSample.textContent = '声サンプル録音開始';
    els.stopSample.textContent = '停止して保存';
    els.startMeetingRec.textContent = '会議録音開始';
    els.stopMeetingRec.textContent = '会議録音停止';

    els.stopSample.disabled = true;
    els.stopMeetingRec.disabled = true;
  }

  function setSampleRecordingUi(isRecording) {
    els.startSample.textContent = isRecording ? '声サンプル録音中...' : '声サンプル録音開始';
    els.startSample.disabled = isRecording;
    els.stopSample.disabled = !isRecording;
  }

  function setMeetingRecordingUi(isRecording) {
    els.startMeetingRec.textContent = isRecording ? '会議録音中...' : '会議録音開始';
    els.startMeetingRec.disabled = isRecording;
    els.stopMeetingRec.disabled = !isRecording;
  }

  document.getElementById('startSample').addEventListener('click', async () => {
    try {
      sampleBlob = null;
      sampleChunks = [];
      sampleStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      sampleRecorder = new MediaRecorder(sampleStream);

      sampleRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          sampleChunks.push(event.data);
        }
      };

      sampleRecorder.onstop = () => {
        sampleBlob = new Blob(sampleChunks, { type: sampleRecorder.mimeType || 'audio/webm' });
        stopTracks(sampleStream);
        sampleStream = null;
        setSampleRecordingUi(false);
        setStatus('声サンプル録音を保存しました');
      };

      sampleRecorder.start();
      setSampleRecordingUi(true);
      setStatus('声サンプル録音中');
    } catch (err) {
      setSampleRecordingUi(false);
      setStatus('声サンプル録音開始エラー: ' + (err.message || err));
    }
  });

  document.getElementById('stopSample').addEventListener('click', async () => {
    try {
      if (!sampleRecorder) {
        setStatus('先に声サンプル録音開始を押してください');
        return;
      }
      if (sampleRecorder.state !== 'inactive') {
        sampleRecorder.stop();
      }
    } catch (err) {
      setSampleRecordingUi(false);
      setStatus('声サンプル停止エラー: ' + (err.message || err));
    }
  });

  document.getElementById('registerParticipant').addEventListener('click', async () => {
    try {
      const name = els.pName.value.trim();
      if (!name) return alert('名前を入力してください');
      if (!sampleBlob) return alert('先に声サンプルを録音してください');

      setStatus('参加者登録中...');
      const sampleBase64 = await blobToBase64(sampleBlob);

      await postNoCors({
        action: 'registerParticipant',
        name: name,
        displayName: name,
        sampleBase64: sampleBase64,
        mimeType: sampleBlob.type || 'audio/webm'
      });

      setStatus('参加者登録を送信しました');
      els.pName.value = '';
      sampleBlob = null;

      setTimeout(async () => {
        await refreshParticipants();
        setStatus('参加者一覧を更新しました');
      }, 1500);
    } catch (err) {
      setStatus('参加者登録エラー: ' + (err.message || err));
    }
  });

  document.getElementById('createMeeting').addEventListener('click', async () => {
    try {
      const title = els.meetingTitle.value.trim();
      if (!title) return alert('会議名を入力してください');

      const ids = [...document.querySelectorAll('input[name="participant"]:checked')].map(el => el.value);

      const res = await jsonp('createMeeting', {
        title: title,
        participantIds: ids.join(',')
      });

      if (!res.ok) {
        alert(res.error || '会議作成失敗');
        return;
      }

      currentMeetingId = res.meetingId;
      els.meetingInfo.textContent = 'meetingId: ' + currentMeetingId;
      setStatus('会議を作成しました');
    } catch (err) {
      setStatus('会議作成エラー: ' + (err.message || err));
    }
  });

  document.getElementById('startMeetingRec').addEventListener('click', async () => {
    try {
      if (!currentMeetingId) return alert('先に会議を作成してください');

      meetingBlob = null;
      meetingChunks = [];
      meetingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      meetingRecorder = new MediaRecorder(meetingStream);

      meetingRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          meetingChunks.push(event.data);
        }
      };

      meetingRecorder.onstop = () => {
        meetingBlob = new Blob(meetingChunks, { type: meetingRecorder.mimeType || 'audio/webm' });
        stopTracks(meetingStream);
        meetingStream = null;
        setMeetingRecordingUi(false);
        setStatus('会議録音を保存しました');
      };

      meetingRecorder.start();
      setMeetingRecordingUi(true);
      setStatus('会議録音中');
    } catch (err) {
      setMeetingRecordingUi(false);
      setStatus('会議録音開始エラー: ' + (err.message || err));
    }
  });

  document.getElementById('stopMeetingRec').addEventListener('click', async () => {
    try {
      if (!meetingRecorder) {
        setStatus('先に会議録音開始を押してください');
        return;
      }
      if (meetingRecorder.state !== 'inactive') {
        meetingRecorder.stop();
      }
    } catch (err) {
      setMeetingRecordingUi(false);
      setStatus('会議録音停止エラー: ' + (err.message || err));
    }
  });

  document.getElementById('uploadMeeting').addEventListener('click', async () => {
    try {
      if (!currentMeetingId) return alert('先に会議を作成してください');
      if (!meetingBlob) return alert('先に会議を録音してください');

      setStatus('会議音声アップロード中...');
      const audioBase64 = await blobToBase64(meetingBlob);

      await postNoCors({
        action: 'uploadMeetingAudio',
        meetingId: currentMeetingId,
        audioBase64: audioBase64,
        mimeType: meetingBlob.type || 'audio/webm'
      });

      setStatus('会議音声の送信を開始しました');
    } catch (err) {
      setStatus('アップロードエラー: ' + (err.message || err));
    }
  });

  document.getElementById('processMeeting').addEventListener('click', async () => {
    try {
      if (!currentMeetingId) return alert('先に会議を作成してください');

      setStatus('議事録生成中... 数分かかることがあります');
      const res = await jsonp('processMeeting', {
        meetingId: currentMeetingId
      });

      if (!res.ok) {
        alert(res.error || '処理失敗');
        return;
      }

      els.result.textContent = JSON.stringify(res.minutes, null, 2);
      setStatus('議事録生成が完了しました');
    } catch (err) {
      setStatus('議事録生成エラー: ' + (err.message || err));
    }
  });

  async function refreshParticipants() {
    const res = await jsonp('listParticipants', {});
    const box = els.participants;
    box.innerHTML = '';

    (res.participants || []).forEach(p => {
      const label = document.createElement('label');
      label.className = 'chk';
      label.innerHTML =
        '<input type="checkbox" name="participant" value="' + escapeHtml(p.participant_id) + '">' +
        '<span>' + escapeHtml(p.display_name || p.name) + '</span>';
      box.appendChild(label);
    });
  }

  function jsonp(action, params) {
    return new Promise((resolve, reject) => {
      const callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const script = document.createElement('script');
      const url = new URL(GAS_URL);

      url.searchParams.set('api', '1');
      url.searchParams.set('action', action);
      url.searchParams.set('callback', callbackName);

      Object.keys(params || {}).forEach(key => {
        url.searchParams.set(key, params[key]);
      });

      let done = false;

      window[callbackName] = (data) => {
        done = true;
        resolve(data);
        cleanup();
      };

      script.onerror = () => {
        reject(new Error('JSONP通信に失敗しました'));
        cleanup();
      };

      function cleanup() {
        if (window[callbackName]) delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      document.body.appendChild(script);
      script.src = url.toString();

      setTimeout(() => {
        if (!done) {
          reject(new Error('JSONP通信がタイムアウトしました'));
          cleanup();
        }
      }, 120000);
    });
  }

  async function postNoCors(body) {
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(body)
    });
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        const dataUrl = reader.result;
        resolve(String(dataUrl).split(',')[1]);
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function stopTracks(stream) {
    if (!stream) return;
    stream.getTracks().forEach(track => track.stop());
  }

  function setStatus(msg) {
    els.status.textContent = msg;
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }
</script>
</body>
</html>
